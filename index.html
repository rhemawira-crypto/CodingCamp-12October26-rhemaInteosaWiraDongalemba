<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <button id="theme-toggle">Toggle Theme</button>

    <div class="dashboard-grid">
      <section id="greeting-widget">
        <p id="clock"></p>
        <p id="date"></p>
        <p id="greeting"></p>
        <input id="name-input" type="text" placeholder="Your name">
        <button id="name-save">Save</button>
      </section>
      <section id="todo-widget">
        <input id="task-input" type="text" maxlength="200" placeholder="New task…">
        <button id="task-add">Add</button>
        <p id="task-warning" class="warning" hidden></p>
        <ul id="task-list"></ul>
      </section>
      <section id="timer-widget">
        <p id="timer-mode">Session</p>
        <p id="timer-display">25:00</p>
        <button id="timer-start">Start</button>
        <button id="timer-stop">Stop</button>
        <button id="timer-reset">Reset</button>
        <p id="timer-status" aria-live="polite"></p>
      </section>
      <section id="links-widget">
        <input id="link-name-input" type="text" placeholder="Label">
        <p id="link-name-warning" class="warning" hidden></p>
        <input id="link-url-input" type="url" placeholder="https://…">
        <p id="link-url-warning" class="warning" hidden></p>
        <button id="link-add">Add</button>
        <ul id="links-list"></ul>
      </section>
    </div>

    <script src="js/script.js" defer></script>
  </body>
</html>
