<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <button id="theme-toggle">Toggle Theme</button>

    <div class="dashboard-grid">
      <section id="greeting-widget">
        <p id="clock"></p>
        <p id="date"></p>
        <p id="greeting"></p>
        <div class="name-form">
          <input id="name-input" type="text" placeholder="Type your name here" aria-label="Your name">
          <button id="name-save">Save</button>
        </div>
      </section>
      <section id="timer-widget">
        <h2 class="widget-title">Focus Timer</h2>
        <p id="timer-mode">Session</p>
        <p id="timer-display">25:00</p>
        <div class="btn-group">
          <button id="timer-start">Start</button>
          <button id="timer-stop">Stop</button>
          <button id="timer-reset">Reset</button>
        </div>
        <p id="timer-status" aria-live="polite"></p>
      </section>
      <section id="todo-widget">
        <h2 class="widget-title">Tasks</h2>
        <div class="input-row">
          <input id="task-input" type="text" maxlength="200" placeholder="New task…" aria-label="New task">
          <button id="task-add">Add</button>
        </div>
        <p id="task-warning" class="warning"></p>
        <ul id="task-list"></ul>
      </section>
      <section id="links-widget">
        <h2 class="widget-title">Quick Links</h2>
        <div class="link-form">
          <div class="link-field">
            <input id="link-name-input" type="text" placeholder="Link name" aria-label="Link name">
            <p id="link-name-warning" class="warning" hidden>Link name is required.</p>
          </div>
          <div class="link-field">
            <input id="link-url-input" type="url" placeholder="https://example.com" aria-label="Link URL">
            <p id="link-url-warning" class="warning" hidden>URL is required.</p>
          </div>
          <button id="link-add">Add Link</button>
        </div>
        <ul id="links-list"></ul>
      </section>
    </div>

    <script src="js/script.js" defer></script>
  </body>
</html>
